   const relative=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
   const impulse=Math.max(1.5,relative*.85+1.2);
   if(!a.dragged){a.vx-=nx*impulse*.6;a.vy-=ny*impulse*.6}
   if(!b.dragged){b.vx+=nx*impulse*.6;b.vy+=ny*impulse*.6}

   const maxX=Math.max(0,W-c.r*2),maxY=Math.max(0,H-c.r*2);

   if(c.x>maxX){c.x=maxX;c.vx=-Math.abs(c.vx)*.6}
   if(c.y<0){c.y=0;c.vy=Math.abs(c.vy)*.6}
   if(c.y>maxY){c.y=maxY;c.vy=-Math.abs(c.vy)*.6}

<script>
/* v26: fit each symbol to the actual circular face; supports dynamically spawned coins. */
(()=>{
 const selector='.pile-coin,.coin-stack .coin';
 let scheduled=false;
 function fit(){
  scheduled=false;
  document.querySelectorAll(selector).forEach(el=>{
   const w=el.getBoundingClientRect().width;
   if(!w)return;
   const text=el.textContent.trim();
   const computed=getComputedStyle(el);
   const available=Math.max(8,w-20);
   const canvas=fit.canvas||(fit.canvas=document.createElement('canvas'));
   const ctx=canvas.getContext('2d');
   if(!ctx)return;
   const weight=computed.fontWeight||'900';
   const family=computed.fontFamily||'sans-serif';
   let size=Math.min(w*.43,43);
   ctx.font=`${weight} ${size}px ${family}`;
   const width=ctx.measureText(text).width;
   if(width>available)size*=available/width;
   el.style.fontSize=`${Math.max(10,Math.floor(size))}px`;
  });
 }
 function schedule(){if(!scheduled){scheduled=true;requestAnimationFrame(fit)}}
 const start=()=>{
  schedule();
  const observer=new MutationObserver(records=>{
   if(records.some(r=>r.type==='childList'||r.type==='characterData'))schedule();
  });
  for(const root of [document.getElementById('coin-world'),document.getElementById('coin-stage')]){
   if(root)observer.observe(root,{subtree:true,childList:true,characterData:true});
  }
  window.addEventListener('resize',schedule,{passive:true});
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
