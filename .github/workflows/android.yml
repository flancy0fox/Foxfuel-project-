name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare app files from flat repository
        run: |
          mkdir -p www
          cp index.html manifest.json icon-192.png icon-512.png www/
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx cap add android
      - name: Sync application assets
        run: npx cap sync android
      - name: Compile installable debug APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: currency-pocket-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
